[package]
name = "epic-cleaner"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/disk-core"]
resolver = "3"

[dependencies]
epic-disk-core = { path = "crates/disk-core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
base64 = "0.23"
rune = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
walkdir = "2.5"
blake3 = "1.8"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.20"

# Rune relies on these forks; Cargo does not inherit patches from dependencies.
[patch.crates-io]
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
winit = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "b5c4fa685ec3d187db2be10b35833614784ee9b0" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
